version: 2

# Commit type decides whether an update ships. release-please treats every
# visible changelog section as releasable, so `deps` both lists an update in
# the changelog and cuts a patch release, while `chore` does neither. Nothing
# Dependabot watches here reaches users -- pre-commit hooks are development
# tooling -- so it uses `chore(deps)`. See yo61/jobhound
# decisions/2026-08-13-dependency-updates-and-releases.md.
#
# Dependabot's auto-detection of conventional-commits style doesn't fire
# reliably on forks, so the prefix is set explicitly.
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      hooks:
        patterns: ["*"]
